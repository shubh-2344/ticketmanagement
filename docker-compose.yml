version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket-mgmt-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=sqlite:./data/tickets.db
    volumes:
      - ./backend/data:/app/data
    networks:
      - ticket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-mgmt-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    networks:
      - ticket-network

networks:
  ticket-network:
    driver: bridge
